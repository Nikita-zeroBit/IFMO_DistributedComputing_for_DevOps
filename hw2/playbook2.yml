---
- name: Установка и настройка WordPress и MySQL
  hosts: all
  gather_facts: no
  become: yes
  vars:
    mysql_root_password: "root1234"
    mysql_database: "wordpress_database"
    mysql_user: "wordpress_user"
    mysql_password: "wordpress_password"
    repl_user: "replication_user"
    repl_password: "replication_pass"
    mysql_primary_port: 3307
    mysql_replica_port: 3308

  tasks:
    - name: Установка необходимых пакетов
      apt:
        name:
          - docker.io
          - python3-pip
          - python3-docker
        state: present
        update_cache: yes

    - name: Запущен ли Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Создание Docker сети
      docker_network:
        name: wp_net
        state: present

    - name: Получение образа MySQL
      docker_image:
        name: mysql:5.7
        source: pull

    - name: Получение образа WordPress
      docker_image:
        name: wordpress:latest
        source: pull
    
    # Создание и настройка мастер контейнера MySQL
    - name: Запуск мастер MySQL в контейнере
      docker_container:
        name: mysql_primary
        image: mysql:5.7
        restart_policy: always
        state: started
        ports:
          - "{{ mysql_primary_port }}:3306"
        networks:
          - name: wp_net
        env:
          MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
          MYSQL_DATABASE: "{{ mysql_database }}"
          MYSQL_USER: "{{ mysql_user }}"
          MYSQL_PASSWORD: "{{ mysql_password }}"
        command: >
          --server-id=1
          --log-bin=mysql-bin
          --binlog-format=ROW
          --bind-address=0.0.0.0
        volumes:
          - mysql_primary_data:/var/lib/mysql

    - name: Проверка что мастер MySQL доступен
      wait_for:
        host: mysql_primary
        port: "{{ mysql_primary_port }}"
        delay: 5
        state: started

    - name: Create replication user on primary
      community.mysql.mysql_query:
        login_host: 127.0.0.1
        login_port: "{{ mysql_primary_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_root_password }}"
        query: |
          CREATE USER IF NOT EXISTS '{{ repl_user }}'@'%' IDENTIFIED BY '{{ repl_password }}';
          GRANT REPLICATION SLAVE ON *.* TO '{{ repl_user }}'@'%';
          FLUSH PRIVILEGES;

    - name: Запуск WordPress в контейнере
      docker_container:
        name: wordpress
        image: wordpress:latest
        state: started
        restart_policy: always
        published_ports:
          - "80:80"
        env:
          WORDPRESS_DB_HOST: "mysql:3306"
          WORDPRESS_DB_NAME: "{{ mysql_database }}"
          WORDPRESS_DB_USER: "{{ mysql_user }}"
          WORDPRESS_DB_PASSWORD: "{{ mysql_password }}"
        depends_on:
          - mysql

    - name: WordPress работает корректно
      uri:
        url: "http://localhost:80"
        status_code: 200
        timeout: 10
      register: wordpress_status
      until: wordpress_status.status == 200
      retries: 10
      delay: 5

